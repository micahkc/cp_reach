name: Notebooks

# Executes the example notebooks end-to-end (compile -> reachability -> plots)
# to catch regressions in the documented RuMoCA 0.10 workflow.
#
# The explicit list below defines the supported notebook integration surface.
# Exploratory notebooks are not part of this workflow.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-notebooks:
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install cp_reach + notebook tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" nbmake ipykernel

      - name: Execute notebooks
        run: |
          pytest --nbmake -p no:cacheprovider --nbmake-timeout=600 -v \
            examples/quadrotor/quadrotor_flowpipe.ipynb \
            examples/rover/rover_plots.ipynb \
            examples/satellite/satellite_error_bounds.ipynb \
            examples/general/structured_nonlinear.ipynb
